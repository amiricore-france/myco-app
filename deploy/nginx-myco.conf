# Reverse proxy Nginx pour Myco — à placer dans /etc/nginx/sites-available/myco
# puis : ln -s /etc/nginx/sites-available/myco /etc/nginx/sites-enabled/
#
# Remplacez mon-domaine.fr par votre domaine. Le certificat TLS est géré par
# Certbot (voir DEPLOY-OVH.md) qui réécrira ce fichier pour le HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name mon-domaine.fr www.mon-domaine.fr;
    server_tokens off;

    # Taille max des uploads (photos) — doit être >= limite du serveur Node (12 Mo).
    client_max_body_size 15m;

    # --- Frontend : build statique du client React ---
    root /var/www/myco/client/dist;
    index index.html;

    # Fichiers hashés par Vite : cache long.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/myco-security-headers.conf;
    }

    # --- API Node (port local 4400) ---
    location /api/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Photos servies par le serveur Node ---
    location /uploads/ {
        proxy_pass http://127.0.0.1:4400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4400;
    }

    # --- SPA : toute autre route renvoie index.html (React Router) ---
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/myco-security-headers.conf;
    }
}
