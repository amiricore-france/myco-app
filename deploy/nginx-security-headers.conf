# En-têtes de sécurité des pages statiques Myco — à placer dans
# /etc/nginx/snippets/myco-security-headers.conf et à inclure dans chaque
# location qui sert le client (un add_header dans une location masque ceux du
# niveau server). L'API et /uploads ont les leurs via helmet (Node).
#
# CSP : sources réellement utilisées par le client —
#   data.geopf.fr        tuiles Plan IGN (affichage + téléchargement hors-ligne)
#   nominatim            recherche d'adresse
#   worker / manifest    service worker et PWA (cartes hors-ligne, notifications)
# Leaflet (CSS, icônes) est désormais embarqué dans le build : plus d'unpkg.
# Le paiement Stripe se fait par redirection vers checkout.stripe.com : rien à autoriser.
#   blob:                aperçu des photos avant envoi
# 'unsafe-inline' en style-src : Leaflet et Recharts posent des styles inline.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://data.geopf.fr; connect-src 'self' https://nominatim.openstreetmap.org https://data.geopf.fr; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
